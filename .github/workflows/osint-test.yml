name: OSINT Case Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  case-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check OSINT scripts
        run: |
          test -f osint/scripts/generate_queries.py
          test -f osint/scripts/correlate_entities.py
          test -f osint/scripts/build_timeline.py
          test -f osint/scripts/evidence_hash.py
          test -f osint/scripts/run_case.py
          test -f osint/scripts/validate_case.py
          echo "All OSINT scripts found."

      - name: Python syntax check
        run: |
          python -m py_compile osint/scripts/*.py

      - name: Create case workspace
        run: |
          mkdir -p case-output/evidence
          mkdir -p case-output/reports
          mkdir -p case-output/logs

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path("case-output")

          manifest = {
              "case_id": "GH-AW-OSINT-TEST",
              "created_utc": datetime.now(timezone.utc).isoformat(),
              "workflow": "OSINT Case Pipeline",
              "scope": "lawful public-source research",
              "status": "initialised",
              "evidence_count": 0
          }

          (out / "case_manifest.json").write_text(
              json.dumps(manifest, indent=2),
              encoding="utf-8"
          )

          (out / "reports" / "README.md").write_text(
              "# OSINT Case Output\n\n"
              "This artifact was generated by the OSINT Case Pipeline.\n\n"
              "Contents:\n"
              "- case_manifest.json\n"
              "- evidence/\n"
              "- reports/\n"
              "- logs/\n",
              encoding="utf-8"
          )
          PY

      - name: Generate integrity hashes
        run: |
          find case-output -type f -print0 | sort -z | \
          xargs -0 sha256sum > case-output/SHA256SUMS.txt

      - name: Show case output
        run: |
          echo "=== CASE OUTPUT ==="
          find case-output -maxdepth 3 -type f -print
          echo ""
          cat case-output/case_manifest.json

      - name: Upload case artifact
        uses: actions/upload-artifact@v4
        with:
          name: osint-case-output
          path: case-output/
          retention-days: 30
